{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header mb-3"><h2 class="page-title">{{ title }}</h2></div>
  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Save student</button>
          <a class="btn btn-outline-secondary" href="{% url 'students:list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
