{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Pending approval - OJT Placement Management System</title>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url("https://rsms.me/inter/inter.css");
    body {
      background-color: var(--dh-bg);
      color: var(--dh-ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: var(--dh-card);
      border: 1px solid var(--dh-line);
    }
    .dh-brand {
      color: var(--dh-gold);
    }
    .text-secondary {
      color: var(--dh-muted) !important;
    }
    .text-primary {
      color: var(--dh-gold) !important;
    }
  </style>
</head>
<body>
  <div class="container container-tight">
    <div class="card card-md">
      <div class="card-body p-4 text-center">
        <i class="fas fa-hourglass-half dh-brand" style="font-size: 48px;"></i>
        <h2 class="h4 mt-3">Account pending approval</h2>
        <p class="text-secondary mt-2">
          Thank you! Your supervisor account registration has been received.<br>
          An administrator must approve it before you can sign in.<br>
          <span class="text-primary">{{ email }}</span>
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary mt-3"><i class="fa fa-arrow-left me-1"></i> Back to login</a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/tabler.js' %}" defer></script>
</body>
</html>
