{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header mb-3"><h2 class="page-title">{{ title }}</h2></div>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {{ student_supervisor_map|json_script:'student-supervisors' }}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Save placement</button>
          <a class="btn btn-outline-secondary" href="{% url 'placements:list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(function () {
  var supervisorSelect = document.querySelector('select[name="supervisor"]');
  var studentSelect = document.querySelector('select[name="student"]');
  if (!supervisorSelect || !studentSelect) { return; }

  var studentDataEl = document.getElementById('student-supervisors');
  var studentData = studentDataEl ? JSON.parse(studentDataEl.textContent) : {};
  var allStudentOptions = Array.prototype.slice.call(studentSelect.options).map(function (o) {
    return { value: o.value, text: o.textContent };
  });

  function setOptions(select, options, current) {
    select.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '---------';
    select.appendChild(placeholder);
    options.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value;
      opt.textContent = o.text;
      if (String(o.value) === String(current)) { opt.selected = true; }
      select.appendChild(opt);
    });
  }

  function rebuildStudents() {
    var supId = supervisorSelect.value;
    var current = studentSelect.value;
    var filtered = allStudentOptions.filter(function (o) {
      if (!o.value) { return false; }
      var sups = studentData[o.value] || [];
      if (sups.length === 0) { return true; } // unassigned students
      return sups.map(String).indexOf(String(supId)) !== -1;
    });
    setOptions(studentSelect, filtered, current);
  }

  supervisorSelect.addEventListener('change', rebuildStudents);
  rebuildStudents();
})();
</script>
{% endblock %}
