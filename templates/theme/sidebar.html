<aside class="navbar navbar-vertical navbar-expand-lg navbar-dark dh-sidebar">
  <div class="container-fluid">
    <div class="navbar-brand navbar-brand-autodark dh-brand">
      <a href="{% url 'dashboard' %}" class="d-flex align-items-center gap-2 text-decoration-none">
        <span class="dh-brand-mark">
          <i class="fa-solid fa-shield-halved"></i>
        </span>
        <span class="lh-1">
          <span class="dh-brand-name">OJT Placement</span>
          <span class="dh-brand-sub">CMaT · KCC</span>
        </span>
      </a>
      <hr class="dh-brand-divider" />
    </div>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sidebar-menu"
      aria-controls="sidebar-menu"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="sidebar-menu">
      <ul class="navbar-nav pt-lg-2 py-lg-2">

        <li class="nav-item">
          <span class="dh-nav-section">MENU</span>
        </li>
        {% if is_student %}
        <li class="nav-item mb-1">
          <a
            class="nav-link {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}"
            href="{% url 'student_dashboard' %}"
            aria-current="{% if request.resolver_match.url_name == 'student_dashboard' %}page{% else %}false{% endif %}"
          >
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa fa-graduation-cap"></i>
            </span>
            <span class="nav-link-title">Student Dashboard</span>
          </a>
        </li>
        {% endif %}

      </ul>

      <div class="dh-nav-sidebar-footer">
        <div class="dh-user-card">
          <span class="dh-avatar">{{ request.user.first_name|first|upper|default:"A" }}</span>
          <div class="dh-user-meta">
            <span class="dh-user-name">{{ request.user.get_full_name|default:"Admin" }}</span>
            <span class="dh-user-role">OJT Coordinator</span>
          </div>
          <a class="dh-user-logout" href="{% url 'logout' %}" title="Sign out">
            <i class="fa fa-sign-out-alt"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</aside>
